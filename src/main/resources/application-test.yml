# Test profile. Datasource URL/username/password are provided by Testcontainers
# via Spring Boot 3 @ServiceConnection support in integration tests.
spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
